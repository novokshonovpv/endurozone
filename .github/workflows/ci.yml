name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enduro
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: enduro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enduro -d enduro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python3 deploy/test_backup.py
        name: Stand backup safety checks
      - run: pnpm test
      - run: pnpm test
        name: Same access tests against PostgreSQL
        env:
          TZ: Europe/Moscow
          TEST_DATABASE_URL: postgresql://enduro:ci-only-password@localhost:5432/enduro_test
      - run: pnpm build
      - run: pnpm api:export
      - run: git diff --exit-code docs/api/openapi.json
