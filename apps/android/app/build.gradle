plugins {
    id 'com.android.application'
}

// The site the app opens. Override for another host: gradlew assembleRelease -PsiteHost=example.org
def siteHost = (project.findProperty('siteHost') ?: 'enduro.200-165-236-78.sslip.io').toString()

// The release key lives outside the repository (see apps/android/README.md).
def keyProps = new Properties()
def keyFile = new File(System.getProperty('user.home'), '.enduro-android/keys/keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'zone.enduro.app'
    compileSdk 34

    defaultConfig {
        applicationId 'zone.enduro.app'
        // Android 7+: runtime permissions for location, WebView file picking.
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '0.26.0'
        resValue 'string', 'site_host', siteHost
        resValue 'string', 'launch_url', "https://${siteHost}/#feed"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile new File(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
